name: Apply AI patch on dev

on:
  push:
    branches:
      - dev-v10.10.6
    paths:
      - ai_patch.part1
      - ai_patch.part2
      - ai_patch.part3
      - ai_patch.part4
      - ai_patch.trigger

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ai-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev-v10.10.6
          fetch-depth: 0

      - name: Wait for all patch parts
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ai_patch.part1 ] && [ -f ai_patch.part2 ] && [ -f ai_patch.part3 ] && [ -f ai_patch.part4 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for all 4 patch parts."
          fi

      - name: Validate and apply patch
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat ai_patch.part1 ai_patch.part2 ai_patch.part3 ai_patch.part4 > /tmp/ai_patch.diff
          git apply --check --ignore-space-change --ignore-whitespace /tmp/ai_patch.diff
          git apply --ignore-space-change --ignore-whitespace /tmp/ai_patch.diff
          rm ai_patch.part1 ai_patch.part2 ai_patch.part3 ai_patch.part4
          rm -f ai_patch.trigger

      - name: Syntax checks
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check code.js
          python3 - <<'PY'
          import re, pathlib, subprocess
          text=pathlib.Path('Index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>([\s\S]*?)</script>', text, re.I)
          pathlib.Path('/tmp/index_scripts.js').write_text('\n'.join(blocks), encoding='utf-8')
          subprocess.check_call(['node','--check','/tmp/index_scripts.js'])
          PY
          grep -q "const APP_VERSION = 'V10.10.6';" code.js
          grep -q 'let APP_VERSION="V10.10.6";' Index.html

      - name: Resolver regression checks
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp code.js /tmp/resolver_test.js
          cat >> /tmp/resolver_test.js <<'JS'
          const oldSuite = runRegressionTestsV105();
          const v2Suite = aiResolverV2SelfTest_();
          if (!oldSuite.pass) {
            console.error('V10.5 regression failed', JSON.stringify(oldSuite));
            process.exit(11);
          }
          if (!v2Suite.pass) {
            console.error('Resolver V2 regression failed', JSON.stringify(v2Suite));
            process.exit(12);
          }
          console.log('V10.5:', oldSuite.passed + '/' + oldSuite.total, 'PASS');
          console.log('Resolver V2:', v2Suite.passed + '/' + v2Suite.total, 'PASS');
          JS
          node /tmp/resolver_test.js

      - name: Commit applied changes
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT AI Patch"
          git config user.email "ai-patch@users.noreply.github.com"
          git add -A
          git commit -m "V10.10.6: Resolver V2 + Confidence Score [ai-applied]"
          git push origin HEAD:dev-v10.10.6
