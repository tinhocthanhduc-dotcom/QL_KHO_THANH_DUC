name: Apply AI transform on dev

on:
  push:
    branches:
      - dev-v10.10.6
    paths:
      - 'ai_transform*.py'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ai-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev-v10.10.6
          fetch-depth: 0

      - name: Apply deterministic transform
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(ls ai_transform*.py | tail -n 1)
          python3 "$SCRIPT"
          rm -f ai_transform*.py

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check code.js
          python3 - <<'PY'
          import re, pathlib, subprocess
          text=pathlib.Path('Index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>([\s\S]*?)</script>', text, re.I)
          pathlib.Path('/tmp/index_scripts.js').write_text('\n'.join(blocks), encoding='utf-8')
          subprocess.check_call(['node','--check','/tmp/index_scripts.js'])
          PY
          grep -q "const APP_VERSION = 'V10.14.0';" code.js
          grep -q 'let APP_VERSION="V10.14.0";' Index.html

      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          cp code.js /tmp/regression_test.js
          cat >> /tmp/regression_test.js <<'JS'
          const oldSuite = runRegressionTestsV105();
          const resolverSuite = aiResolverV2SelfTest_();
          const historicalSuite = aiHistoricalVoucherSelfTestV1107_();
          const commandResolverV3 = aiCommandResolverV3SelfTest_();
          const learningSuite = aiLearningMemorySelfTestV10109_();
          const smartSuite = aiSmartAgentSelfTestV10110_();
          const manualSuite = manualInventorySelfTestV10122_();
          const voucherSuite = inventoryVoucherPhase3ASelfTestV10130_();
          const voucherAdjustSuite = voucherAdjustmentSelfTestV10131_();
          const voucher3CSuite = voucherPhase3CSelfTestV10132_();
          const voucherCenterSuite = voucherCenterSelfTestV10140_();
          if (!oldSuite.pass) process.exit(11);
          if (!resolverSuite.pass) process.exit(12);
          if (!historicalSuite.pass) process.exit(13);
          if (!commandResolverV3.pass) process.exit(14);
          if (!learningSuite.pass) process.exit(15);
          if (!smartSuite.pass) { console.error(JSON.stringify(smartSuite)); process.exit(16); }
          if (!manualSuite.pass) { console.error(JSON.stringify(manualSuite)); process.exit(17); }
          if (!voucherSuite.pass) { console.error(JSON.stringify(voucherSuite)); process.exit(18); }
          if (!voucherAdjustSuite.pass) { console.error(JSON.stringify(voucherAdjustSuite)); process.exit(19); }
          if (!voucher3CSuite.pass) { console.error(JSON.stringify(voucher3CSuite)); process.exit(20); }
          if (!voucherCenterSuite.pass) { console.error(JSON.stringify(voucherCenterSuite)); process.exit(21); }
          console.log('Core:', oldSuite.passed + '/' + oldSuite.total, 'PASS');
          console.log('Resolver:', resolverSuite.passed + '/' + resolverSuite.total, 'PASS');
          console.log('Historical:', historicalSuite.passed + '/' + historicalSuite.total, 'PASS');
          console.log('Command V3:', commandResolverV3.passed + '/' + commandResolverV3.total, 'PASS');
          console.log('Learning:', learningSuite.passed + '/' + learningSuite.total, 'PASS');
          console.log('Smart Agent:', smartSuite.passed + '/' + smartSuite.total, 'PASS');
          console.log('Manual Inventory:', manualSuite.passed + '/' + manualSuite.total, 'PASS');
          console.log('Voucher UI 3A:', voucherSuite.passed + '/' + voucherSuite.total, 'PASS');
          console.log('Voucher 3B:', voucherAdjustSuite.passed + '/' + voucherAdjustSuite.total, 'PASS');
          console.log('Voucher 3C:', voucher3CSuite.passed + '/' + voucher3CSuite.total, 'PASS');
          console.log('Voucher Center 4A:', voucherCenterSuite.passed + '/' + voucherCenterSuite.total, 'PASS');
          JS
          node /tmp/regression_test.js

      - name: Commit applied changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT AI Patch"
          git config user.email "ai-patch@users.noreply.github.com"
          git add -A
          git commit -m "V10.14.0: Voucher Center Phase 4A [ai-applied]"
          git push origin HEAD:dev-v10.10.6
