name: Deploy Apps Script production

on:
  workflow_dispatch:
  push:
    branches:
      - dev-v10.10.6
    paths:
      - deploy_request.txt

permissions:
  contents: read

concurrency:
  group: ql-kho-apps-script-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: dev-v10.10.6
          fetch-depth: 1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "Missing repository secret CLASPRC_JSON"
            exit 21
          fi
          if [ -z "${APPS_SCRIPT_DEPLOYMENT_ID:-}" ]; then
            echo "Missing repository variable APPS_SCRIPT_DEPLOYMENT_ID"
            exit 22
          fi
          test -f .clasp.json
          test -f appsscript.json
          test -f code.js
          test -f Index.html

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check code.js
          python3 - <<'PY'
          import re, pathlib, subprocess
          text = pathlib.Path('Index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script[^>]*>([\s\S]*?)</script>', text, re.I)
          pathlib.Path('/tmp/index_scripts.js').write_text('\n'.join(blocks), encoding='utf-8')
          subprocess.check_call(['node', '--check', '/tmp/index_scripts.js'])
          PY
          grep -q "const APP_VERSION = 'V10.18.0';" code.js
          grep -q 'let APP_VERSION="V10.18.0";' Index.html

      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          cp code.js /tmp/regression_test.js
          cat >> /tmp/regression_test.js <<'JS'
          const oldSuite = runRegressionTestsV105();
          const resolverSuite = aiResolverV2SelfTest_();
          const historicalSuite = aiHistoricalVoucherSelfTestV1107_();
          const commandResolverV3 = aiCommandResolverV3SelfTest_();
          const learningSuite = aiLearningMemorySelfTestV10109_();
          const smartSuite = aiSmartAgentSelfTestV10110_();
          const manualSuite = manualInventorySelfTestV10122_();
          const voucherSuite = inventoryVoucherPhase3ASelfTestV10130_();
          const voucherAdjustSuite = voucherAdjustmentSelfTestV10131_();
          const voucher3CSuite = voucherPhase3CSelfTestV10132_();
          const voucherCenterSuite = voucherCenterSelfTestV10140_();
          const voucherCenter4BSuite = voucherCenter4BSelfTestV10141_();
          const voucherCenter4CSuite = voucherCenter4CSelfTestV10150_();
          const voucherPhase5Suite = voucherCorrectionPhase5SelfTestV10151_();
          const voucherDckSuite = voucherDckCorrectionSelfTestV10152_();
          const voucherKkSuite = voucherCountCorrectionSelfTestV10153_();
          if (!oldSuite.pass) process.exit(31);
          if (!resolverSuite.pass) process.exit(32);
          if (!historicalSuite.pass) process.exit(33);
          if (!commandResolverV3.pass) process.exit(34);
          if (!learningSuite.pass) process.exit(35);
          if (!smartSuite.pass) { console.error(JSON.stringify(smartSuite)); process.exit(36); }
          if (!manualSuite.pass) { console.error(JSON.stringify(manualSuite)); process.exit(37); }
          if (!voucherSuite.pass) { console.error(JSON.stringify(voucherSuite)); process.exit(38); }
          if (!voucherAdjustSuite.pass) { console.error(JSON.stringify(voucherAdjustSuite)); process.exit(39); }
          if (!voucher3CSuite.pass) { console.error(JSON.stringify(voucher3CSuite)); process.exit(40); }
          if (!voucherCenterSuite.pass) { console.error(JSON.stringify(voucherCenterSuite)); process.exit(41); }
          if (!voucherCenter4BSuite.pass) { console.error(JSON.stringify(voucherCenter4BSuite)); process.exit(42); }
          if (!voucherCenter4CSuite.pass) { console.error(JSON.stringify(voucherCenter4CSuite)); process.exit(43); }
          if (!voucherPhase5Suite.pass) { console.error(JSON.stringify(voucherPhase5Suite)); process.exit(44); }
          if (!voucherDckSuite.pass) { console.error(JSON.stringify(voucherDckSuite)); process.exit(45); }
          if (!voucherKkSuite.pass) { console.error(JSON.stringify(voucherKkSuite)); process.exit(46); }
          console.log('Core regression:', oldSuite.passed + '/' + oldSuite.total, 'PASS');
          console.log('Resolver V2:', resolverSuite.passed + '/' + resolverSuite.total, 'PASS');
          console.log('Historical Voucher:', historicalSuite.passed + '/' + historicalSuite.total, 'PASS');
          console.log('Command Resolver V3:', commandResolverV3.passed + '/' + commandResolverV3.total, 'PASS');
          console.log('Learning Memory:', learningSuite.passed + '/' + learningSuite.total, 'PASS');
          console.log('Smart Agent:', smartSuite.passed + '/' + smartSuite.total, 'PASS');
          console.log('Manual Inventory:', manualSuite.passed + '/' + manualSuite.total, 'PASS');
          console.log('Voucher UI 3A:', voucherSuite.passed + '/' + voucherSuite.total, 'PASS');
          console.log('Voucher 3B:', voucherAdjustSuite.passed + '/' + voucherAdjustSuite.total, 'PASS');
          console.log('Voucher 3C:', voucher3CSuite.passed + '/' + voucher3CSuite.total, 'PASS');
          console.log('Voucher Center 4A:', voucherCenterSuite.passed + '/' + voucherCenterSuite.total, 'PASS');
          console.log('Voucher Center 4B:', voucherCenter4BSuite.passed + '/' + voucherCenter4BSuite.total, 'PASS');
          console.log('Voucher Center 4C:', voucherCenter4CSuite.passed + '/' + voucherCenter4CSuite.total, 'PASS');
          console.log('Voucher correction Stage 5:', voucherPhase5Suite.passed + '/' + voucherPhase5Suite.total, 'PASS');
          console.log('DCK correction Stage 5:', voucherDckSuite.passed + '/' + voucherDckSuite.total, 'PASS');
          console.log('KK correction Stage 5:', voucherKkSuite.passed + '/' + voucherKkSuite.total, 'PASS');
          JS
          node /tmp/regression_test.js

      - name: Install clasp
        shell: bash
        run: npm install -g @google/clasp@latest

      - name: Restore Google authorization
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user || true

      - name: Push source to Apps Script
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force

      - name: Update existing production deployment
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE "const APP_VERSION = '[^']+'" code.js | head -n1 | cut -d"'" -f2)
          DESC="${VERSION:-QL_KHO} - AI automatic deploy - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          clasp create-deployment --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --description "$DESC"
          clasp list-deployments
          echo "### Apps Script deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${VERSION:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment ID: ${APPS_SCRIPT_DEPLOYMENT_ID:0:12}…" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary auth file
        if: always()
        shell: bash
        run: rm -f "$HOME/.clasprc.json"
